name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # PyInstaller 不能跨平台，Windows 产物必须在 Windows 上构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: 同步依赖
        # 解释器与依赖由 uv 按 pyproject.toml 与 uv.lock 安装，dev 组包含 PyInstaller
        run: uv sync --locked

      - name: 校验 tag 与程序版本
        # 版本号唯一来源是 uninstall_cleaner.__init__.__version__
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $appVersion = (uv run python -c "from uninstall_cleaner import __version__; print(__version__)").Trim()
          $tagVersion = $env:TAG_NAME.TrimStart('v')
          if ($appVersion -ne $tagVersion) {
            Write-Error "版本不一致：tag 为 v$tagVersion，程序版本为 $appVersion，请先更新 src/uninstall_cleaner/__init__.py"
            exit 1
          }
          Write-Host "版本一致：v$appVersion"

      - name: 校验图形库
        # 打包需要可用的 tkinter，缺失时提前失败，避免产出无法启动的 exe
        run: uv run python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: PyInstaller 打包 exe
        # 单文件、无控制台窗口，配置见 packaging/uninstall-cleaner.spec
        run: >
          uv run pyinstaller --noconfirm --clean
          --distpath dist --workpath build
          packaging/uninstall-cleaner.spec

      - name: 验证产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'dist\*.exe'
          if ($exe.Count -eq 0) {
            Write-Error "未找到任何 .exe 产物，打包可能失败"
            exit 1
          }
          $proc = Start-Process -FilePath $exe[0].FullName -ArgumentList '--cli','--help' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Error "exe 启动失败，退出码 $($proc.ExitCode)"
            exit 1
          }
          $exe |
            Select-Object Name, @{N='Size_MB';E={[Math]::Round($_.Length/1MB,2)}}, LastWriteTime |
            Format-Table -AutoSize

      - name: 清理同名 tag 的旧 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --json name 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "发现旧 release, 正在删除..."
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) {
              Write-Error "删除旧 release 失败, 请检查权限或网络"
              exit 1
            }
            Write-Host "已删除旧 release: $tag"
          } else {
            Write-Host "无旧 release ($tag), 跳过清理"
          }
          $LASTEXITCODE = 0

      - name: 上传 exe 到 Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
